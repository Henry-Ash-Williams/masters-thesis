program: train.py
name: transformer-sweep 
project: simple-opcode-transformer
method: bayes 
metric: 
  goal: maximize
  name: acc
parameters: 
  batch-size:
    min: 1
    max: 128
  max-len: 
    min: 10 
    max: 512
  embedding-dim: 
    min: 1 
    max: 10 
  num-heads: 
    min: 1 
    max: 10
  num-layers:
    min: 1 
    max: 10
  hidden-dim:
    min: 10 
    max: 512
  learning-rate:
    min: 0.0000001
    max: 0.25
  dropout-rate:
    min: 0.0
    max: 1.0